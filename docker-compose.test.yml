# A composer for running tests
services:
  voting_db_test:
    image: postgres:18.6
    container_name: voting_db_test_container
    env_file:
      - test.env
    ports:
      - "5434:5432"
    healthcheck:
    # This is doing the health checking. 
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
  pytest:
  ## Imagin we are staying in a repo inside a container for testing. 
  # the test file imports the main.py and the voting app modules. 
  # Then it makes a local (since we are inside the docker the local ist the container)
  # Thus, the config file should refer to the host as voting_db_test. 
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pytest_container
    env_file:
      - test.env
    environment:
      - PYTHONPATH=/app
    # command: "pytest -v"
    command: >
      sh -c '
      Time=$$(date +%Y-%m-%d_%H-%M-%S) &&
      echo "Current Time: $$Time" &&
      python -c "from utils.db_model import Admin; from utils.db import Base, Engine; Base.metadata.create_all(bind=Engine)" &&
      pytest ./test -v --tb=long --html=./test_reports/report-$$Time.html --junitxml=test_reports/junit_$$Time.xml --capture=tee-sys --self-contained-html --log-level=ERROR
      '
    # -v is for verbose output
    # --tb=long is for showing long traceback
    # --html=./test_reports/report-$$Time.html is for generating an HTML report with the current timestamp
    # --self-contained-html ensures the HTML report is self-contained
    # --capture=tee-sys captures the output and displays it in real-time
    # --junitxml=test_reports/junit_$$Time.xml generates a JUnit XML report with the current timestamp
    depends_on:
      voting_db_test:
        condition: service_healthy
    volumes:
      - "./test_reports:/app/test_reports"
