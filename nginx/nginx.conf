# Worker process is the number of worker processes to handle client requests. Usually set to the number of CPU cores.
# worker_processes auto;  # This can automatically set the number of worker processes based on the number of CPU cores.
worker_processes 1;

events {
    # events block is used to configure how Nginx handles connections.
    # Example: set the maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;  # Set the maximum number of simultaneous connections per worker process.
}


http {

    upstream mc26_load_balancer {
        server mc26:8000 max_fails=3 fail_timeout=30s;  # Define the backend server for the upstream block.
    }

    server {
        listen 80;  # Listen on port 80 for incoming HTTP requests.
        server_name localhost;  # Set the server name to localhost.
        return 308 https://$host$request_uri;  # Preserve the request method and body when redirecting to HTTPS.
    }

    server {
        listen 443 ssl;  # Listen on port 443 for incoming HTTPS requests.
        listen [::]:443 ssl;  # Listen on port 443 for incoming HTTPS requests using IPv6 as well.
        server_name localhost;  # Set the server name to localhost.

        ssl_certificate /etc/ssl/certs/nginx.crt;  # Path to the SSL certificate.
        ssl_certificate_key /etc/ssl/private/nginx.key;  # Path to the SSL certificate key.

        location / {

            proxy_pass http://mc26_load_balancer;  # Forward requests to the backend server running on port 8000.
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
